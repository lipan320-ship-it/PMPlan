[package]
name = "pmplan"
version = "0.1.0"
description = "Local-first planning board"
authors = ["PMPlan contributors"]
edition = "2021"

[lib]
name = "pmplan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
